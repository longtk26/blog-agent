name: blog-agent

# All host ports bind to 127.0.0.1 only: the agent is a local, single-user tool.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog_agent}
      POSTGRES_DB: ${POSTGRES_DB:-blog_agent}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  renderer:
    build: ./renderer
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:8080/health\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))'"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  api:
    build: ./api
    env_file: .env
    environment:
      DB_URL: postgresql://${POSTGRES_USER:-blog_agent}:${POSTGRES_PASSWORD:-blog_agent}@db:5432/${POSTGRES_DB:-blog_agent}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://127.0.0.1:${UI_PORT:-3100},http://localhost:${UI_PORT:-3100}
      DIAGRAM_RENDERER_URL: http://renderer:8080
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  ui:
    build: ./ui
    environment:
      # Server-only: the browser talks to the UI's /api/agent proxy, which adds the key.
      AGENT_API_URL: http://api:8000
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UI_PORT:-3100}:3000"

volumes:
  pgdata:
